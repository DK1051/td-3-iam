# roles-map.yaml - which Keycloak groups a person belongs to, worked out from the HR feed.
#
# A person's groups = the groups of their department + the groups of their job title.
# managed_groups (at the bottom) lists EVERY group the engine may add or remove, including old
# groups this map no longer hands out: if somebody is still in one of those, the engine removes
# them. Any group not listed there is never touched. Every group handed out below must be in
# managed_groups, and every department and job title used in the feed must appear here,
# otherwise the engine stops with a clear message (it never guesses).
#
# The realm role "manager" is not mapped here on purpose: scripts/keycloak-dev.sh gives it to
# anyone who appears as somebody's manager_id. The engine never assigns realm roles.
departments:
  finance: [finance]
  member-services: [member-services]
  it: [it]

job_titles:
  Payments Officer: [payments-initiate]   # can start (initiate) a payment
  Finance Manager: [payments-approve]     # can approve a payment someone else started
  IT Administrator: [privileged]          # powerful admin access
  Helpdesk Analyst: [helpdesk]
  IT Manager: []
  Teller: []
  Member Service Representative: []

managed_groups:
  - finance
  - helpdesk
  - it
  - member-services
  - payments-approve
  - payments-initiate
  - privileged
